<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laniko | Extrait de Parfum</title>
  <meta name="description" content="Laniko extraits de parfum, 50 ml. Discover the collection, our top sellers, and save your favourites.">
  <meta name="theme-color" content="#fafaf8">
  <meta property="og:title" content="Laniko | Extrait de Parfum">
  <meta property="og:description" content="Five extraits de parfum, 50 ml.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="chrome">
    <header class="top">
      <a href="#/perfumes" class="brand" aria-label="Laniko, home">
        <img src="/logo.svg" alt="Laniko" width="21" height="52">
      </a>
      <button id="cart-btn" class="cart-btn" aria-label="Open cart">
        Cart <span id="cart-count">0</span>
      </button>
    </header>
    <nav class="tabs" aria-label="Pages">
      <a href="#/perfumes" data-route="perfumes">Perfumes</a>
      <a href="#/top-sellers" data-route="top-sellers">Top sellers</a>
      <a href="#/wishlist" data-route="wishlist">Wishlist<span id="tab-wish-count" class="tab-count" hidden></span></a>
    </nav>
  </div>

  <main>
    <section class="page-head">
      <h2 id="page-title"></h2>
      <p id="page-sub"></p>
    </section>
    <p id="status" class="notice" hidden></p>
    <section id="products" class="grid" aria-live="polite">Loading…</section>
  </main>

  <aside id="cart" class="cart" hidden>
    <div class="cart-head">
      <h2>Your cart</h2>
      <button id="cart-close" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <p>Subtotal: <strong id="cart-subtotal">€0.00</strong></p>
      <p class="small">Shipping is calculated at checkout.</p>
      <button id="checkout-btn" class="primary" disabled>Checkout</button>
    </div>
  </aside>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="3D view">
    <div class="viewer-head">
      <strong id="viewer-title"></strong>
      <button id="viewer-close" aria-label="Close 3D view">✕</button>
    </div>
    <div id="viewer-stage" class="viewer-stage"></div>
    <p id="viewer-hint" class="viewer-hint">Drag to rotate · pinch to zoom</p>
    <div class="viewer-foot">
      <span id="viewer-price" class="price"></span>
      <button id="viewer-add" class="primary">Add to cart</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="foot">
    <img src="/logo.svg" alt="" width="14" height="35" class="foot-logo">
    <p>© Laniko · Extrait de Parfum</p>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
