<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laniko | Extrait de Parfum</title>
  <meta name="description" content="Laniko extraits de parfum, 50 ml. Discover the collection, our top sellers, and save your favourites.">
  <meta name="theme-color" content="#fafaf8">
  <meta property="og:title" content="Laniko | Extrait de Parfum">
  <meta property="og:description" content="Five extraits de parfum, 50 ml.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap">
  <script>try{var _t=localStorage.getItem("laniko-theme");document.documentElement.dataset.theme=(_t==="dark"||(_t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light";}catch(e){}</script>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="chrome">
    <header class="top">
      <a href="/" class="brand" data-route="perfumes" data-i18n-aria="brandAria" aria-label="Laniko, home">
        <img src="/logo.svg" alt="Laniko" width="21" height="52">
      </a>
      <div class="top-actions">
        <button id="theme-btn" class="theme-btn" aria-label="Switch to dark mode">
          <svg class="ico-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        </button>
        <button id="lang-btn" class="lang-btn" data-i18n-aria="langBtnAria" aria-label="Change language">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>
          <span id="lang-short">EN</span>
        </button>
        <button id="cart-btn" class="cart-btn" data-i18n-aria="openCart" aria-label="Open cart">
          <span data-i18n="cart">Cart</span> <span id="cart-count">0</span>
        </button>
      </div>
    </header>
    <nav class="tabs" data-i18n-aria="pagesAria" aria-label="Pages">
      <a href="/" data-route="perfumes" data-i18n="perfumes">Perfumes</a>
      <a href="#/top-sellers" data-route="top-sellers" data-i18n="topSellers">Top sellers</a>
      <a href="#/wishlist" data-route="wishlist"><span data-i18n="wishlist">Wishlist</span><span id="tab-wish-count" class="tab-count" hidden></span></a>
    </nav>
  </div>

  <main>
    <section class="page-head">
      <h2 id="page-title"></h2>
      <p id="page-sub"></p>
    </section>
    <div id="page-actions" class="page-actions"></div>
    <p id="status" class="notice" hidden></p>
    <section id="products" class="grid" aria-live="polite" data-i18n="loading">Loading…</section>
  </main>

  <aside id="cart" class="cart" hidden>
    <div class="cart-head">
      <h2 data-i18n="yourCart">Your cart</h2>
      <button id="cart-close" data-i18n-aria="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <div id="gift" class="gift" hidden>
        <label class="gift-toggle"><input type="checkbox" id="gift-on"><span class="gift-sw" aria-hidden="true"></span><span data-i18n="giftToggle">This is a gift</span></label>
        <div id="gift-body" class="gift-body" hidden>
          <input id="gift-from" type="text" maxlength="40" autocomplete="off" data-i18n-ph="giftFrom" data-i18n-aria="giftFrom" aria-label="Your name" placeholder="Your name">
          <textarea id="gift-msg" rows="3" maxlength="240" data-i18n-ph="giftMsgPh" data-i18n-aria="giftMsg" aria-label="Your message" placeholder="Write a personal message"></textarea>
          <fieldset class="gift-wraps"><legend data-i18n="giftWrap">Wrapping</legend>
            <label><input type="radio" name="gift-wrap" value="ivory" checked><span class="sw sw-ivory"></span><em data-i18n="wrapIvory">Ivory</em></label>
            <label><input type="radio" name="gift-wrap" value="noir"><span class="sw sw-noir"></span><em data-i18n="wrapNoir">Noir</em></label>
            <label><input type="radio" name="gift-wrap" value="rouge"><span class="sw sw-rouge"></span><em data-i18n="wrapRouge">Rouge</em></label>
          </fieldset>
          <button id="gift-preview" class="act" type="button" data-i18n="giftPreview">Preview the unboxing</button>
          <p class="small" data-i18n="giftNote">After you pay, you get a link to send: it opens an animated gift box with your message.</p>
        </div>
      </div>
      <p><span data-i18n="subtotal">Subtotal</span>: <strong id="cart-subtotal">€0.00</strong></p>
      <p class="small" data-i18n="shipNote">Shipping is calculated at checkout.</p>
      <button id="checkout-btn" class="primary" data-i18n="checkout" disabled>Checkout</button>
    </div>
  </aside>

  <div id="detail" class="pd-wrap" hidden role="dialog" aria-modal="true">
    <div class="pd">
      <div class="pd-top">
        <button id="pd-back" class="pd-back" data-i18n-aria="pdBack" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="snd-btn" class="pd-back pd-snd" aria-pressed="false" aria-label="Turn on sound and haptics">
          <svg class="ico-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
      <div id="pd-stage" class="pd-stage">
        <button id="pd-pic" class="pd-pic" aria-label="View in 3D">
          <img id="pd-poster" class="pd-poster" alt="">
          <canvas id="pd-canvas" class="pd-canvas"></canvas>
          <canvas id="pd-mist" class="pd-mist"></canvas>
          <span class="pd-3d">3D</span>
          <span class="pd-hint"><span data-i18n="pdScroll">Scroll to discover</span><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
      </div>
      <div id="pd-scroll" class="pd-scroll" tabindex="0"><div id="pd-inner" class="pd-inner"></div></div>
      <div class="pd-bar">
        <span id="pd-price" class="price"></span>
        <button id="pd-add" class="primary" data-i18n="add">Add to cart</button>
      </div>
    </div>
  </div>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" data-i18n-aria="view3dLabel" aria-label="3D view">
    <div class="viewer-head">
      <strong id="viewer-title"></strong>
      <button id="viewer-close" data-i18n-aria="close3d" aria-label="Close 3D view">✕</button>
    </div>
    <div id="viewer-stage" class="viewer-stage"></div>
    <div id="viewer-desc" class="viewer-desc" aria-hidden="false"></div>
    <div class="viewer-tools">
      <button id="viewer-spray" class="act" type="button" data-i18n-aria="sprayAria" aria-label="Spray the perfume"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h6M4 8h5M4 16h5M13 7l3-2M13 12h4M13 17l3 2"/></svg><span data-i18n="sprayBtn">Spray</span></button>
      <button id="viewer-ar" class="act" type="button" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span data-i18n="arBtn">See it in your room</span></button>
    </div>
    <p id="viewer-hint" class="viewer-hint" data-i18n="viewerHint">Drag to rotate · pinch to zoom · two fingers to move</p>
    <div class="viewer-foot">
      <span id="viewer-price" class="price"></span>
      <button id="viewer-add" class="primary" data-i18n="add">Add to cart</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="foot">
    <img src="/logo.svg" alt="" width="14" height="35" class="foot-logo">
    <p data-i18n="footer">© Laniko · Extrait de Parfum</p>
  </footer>
  <script src="/i18n.js"></script>
  <script src="/i18n-extra.js"></script>
  <script src="/i18n-more.js"></script>
  <script src="/app.js"></script>
</body>
</html>
