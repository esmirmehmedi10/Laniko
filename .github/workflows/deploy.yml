name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect static files
        run: |
          mkdir dist
          cp index.html success.html style.css pattern.svg i18n.js i18n-extra.js i18n-more.js i18n-about.js i18n-chapter.js i18n-discover.js about.js chapter.js music.js app.js features.js extras.js ar.js sound.js detail-anim.js viewer.js products.json logo.svg favicon.svg dist/
          [ -d images ] && cp -r images dist/images || true
          [ -d models ] && cp -r models dist/models || true
          [ -d voice ] && cp -r voice dist/voice || true

      - name: Create Pages project (first run only)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create laniko --production-branch=main

      - name: Deploy (static files + functions/)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laniko --branch=main
