name: List TTS models
on:
  push:
    paths: ['.github/workflows/tts-models.yml']
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Text-to-speech models in the Cloudflare catalog
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for q in "task=Text-to-Speech" "search=tts" "search=speech" "search=eleven" "search=gpt-4o-mini-tts"; do
            echo "== $q"
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/ai/models/search?per_page=100&$q" | jq -r 'if .success then (.result[] | "\(.name) | \(.task.name // "") | \(.description[0:80])") else (.errors|tostring) end' | head -40
          done
