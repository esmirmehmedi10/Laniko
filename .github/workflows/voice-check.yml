name: Voice check
on:
  push:
    paths: ['.github/workflows/voice-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live site for one sentence in each voice language
        run: |
          sleep 20
          for body in '{"lang":"en","ids":["abTag"],"speaker":"luna"}' '{"lang":"es","ids":["abTag"],"speaker":"carina"}' '{"lang":"fr","ids":["abTag"]}' '{"lang":"zh","ids":["abTag"]}'; do
            code=$(curl -sS -m 60 -o out.bin -D hdr.txt -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" -X POST -H "content-type: application/json" -d "$body" https://laniko.pages.dev/api/narrate || true)
            echo "$body -> $code | first bytes: $(head -c 4 out.bin | od -An -tx1 | tr -d ' ')"
            [ "$(head -c 1 out.bin)" = "{" ] && head -c 200 out.bin && echo
          done
